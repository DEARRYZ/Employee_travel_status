<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แจ้งสถานะการเดินทาง</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#122b4f; --navy-2:#1c3d6e;
  --blue:#2563eb; --green:#0f9d58; --amber:#c88a12; --red:#d0393a;
  --ink:#1a2233; --sub:#5b6577; --line:#e4e8f0;
  --bg:#eef1f6; --card:#ffffff;
  --green-bg:#e5f6ec; --amber-bg:#fdf1de; --red-bg:#fbe7e7; --blue-bg:#e8f0fd;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d131f; --card:#141c2c; --ink:#e7ecf5; --sub:#94a1b8; --line:#26314a;
    --green-bg:#0f2a1e; --amber-bg:#2e2410; --red-bg:#301416; --blue-bg:#122036;
  }
}
:root[data-theme="dark"]{
  --bg:#0d131f; --card:#141c2c; --ink:#e7ecf5; --sub:#94a1b8; --line:#26314a;
  --green-bg:#0f2a1e; --amber-bg:#2e2410; --red-bg:#301416; --blue-bg:#122036;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Noto Sans Thai','Noto Sans',sans-serif;
  background:var(--bg); color:var(--ink); min-height:100%;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 48px;}
.hero{
  background:linear-gradient(135deg,var(--navy),var(--navy-2));
  border-radius:16px; padding:20px 20px 18px; color:#fff;
  position:relative; overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;
  background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);
  border-radius:50%;
}
.hero h1{font-size:19px;font-weight:800;letter-spacing:.1px;}
.hero p{font-size:12.5px;color:#c7d3e8;margin-top:4px;font-weight:500;}
.tabs{display:flex;gap:8px;margin-top:16px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:4px;}
.tab{flex:1;text-align:center;padding:10px 8px;border-radius:9px;font-size:13.5px;font-weight:700;
  color:var(--sub);cursor:pointer;user-select:none;transition:background .15s,color .15s;}
.tab.active{background:var(--navy);color:#fff;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px;}
.card h2{font-size:15px;font-weight:800;margin-bottom:3px;}
.card .hint{font-size:12px;color:var(--sub);margin-bottom:14px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:5px;}
input[type=text],input[type=date],select,textarea{
  width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:9px;
  font-family:inherit;font-size:14px;background:var(--bg);color:var(--ink);
}
textarea{resize:vertical;min-height:64px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.status-opt{
  border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12.5px;font-weight:700;
  cursor:pointer;text-align:center;transition:.15s;
}
.status-opt.sel-green{background:var(--green-bg);color:var(--green);}
.status-opt.sel-amber{background:var(--amber-bg);color:var(--amber);}
.status-opt.sel-red{background:var(--red-bg);color:var(--red);}
.status-opt.picked{outline:2.5px solid currentColor;}
.status-opt:not(.picked){opacity:.55;}
.btn{
  width:100%;padding:13px;border:none;border-radius:10px;background:var(--blue);color:#fff;
  font-weight:800;font-size:14.5px;cursor:pointer;margin-top:4px;
}
.btn:disabled{opacity:.6;}
.msg{font-size:12.5px;margin-top:9px;text-align:center;font-weight:600;}
.msg.ok{color:var(--green);} .msg.err{color:var(--red);}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center;}
.stat .n{font-size:20px;font-weight:800;}
.stat .l{font-size:10px;color:var(--sub);font-weight:700;margin-top:2px;line-height:1.25;}
.stat.blue .n{color:var(--blue);} .stat.green .n{color:var(--green);}
.stat.amber .n{color:var(--amber);} .stat.red .n{color:var(--red);}
.table-wrap{margin-top:14px;overflow-x:auto;border:1px solid var(--line);border-radius:14px;}
table{width:100%;border-collapse:collapse;min-width:560px;background:var(--card);}
thead th{
  background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;text-align:left;
  padding:9px 10px;position:sticky;top:0;
}
tbody td{padding:9px 10px;font-size:12.5px;border-top:1px solid var(--line);vertical-align:top;}
tbody tr:nth-child(even){background:rgba(120,140,180,.06);}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge.green{background:var(--green-bg);color:var(--green);}
.badge.amber{background:var(--amber-bg);color:var(--amber);}
.badge.red{background:var(--red-bg);color:var(--red);}
.team-chip{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;background:var(--blue-bg);color:var(--blue);}
.name{font-weight:700;}
.empty{padding:26px;text-align:center;color:var(--sub);font-size:13px;}
.editrow{font-size:11px;color:var(--sub);margin-top:2px;}
.small{font-size:11px;color:var(--sub);}
#formView,#dashView{display:none;}
#formView.active,#dashView.active{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>แจ้งสถานะการเดินทางมาทำงาน</h1>
    <p>สถานการณ์น้ำท่วม — แจ้งสถานะของคุณ หรือดูภาพรวมทีม</p>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="form">แจ้งสถานะของฉัน</div>
    <div class="tab" data-tab="dash">แดชบอร์ดภาพรวม</div>
  </div>

  <div id="formView" class="active">
    <div class="card">
      <h2>กรอกข้อมูลการเดินทาง</h2>
      <div class="hint">ข้อมูลจะแสดงผลแบบเรียลไทม์ในแดชบอร์ดให้หัวหน้าทีมเห็นทันที</div>

      <div class="row2">
        <div class="field">
          <label>วันที่</label>
          <input type="date" id="f-date">
        </div>
        <div class="field">
          <label>Team</label>
          <select id="f-team">
            <option value="S">S</option>
            <option value="T2">T2</option>
            <option value="T1">T1</option>
            <option value="Other">อื่นๆ</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>รหัสพนักงาน</label>
          <input type="text" id="f-code" placeholder="เช่น K11686">
        </div>
        <div class="field">
          <label>ชื่อ-นามสกุล</label>
          <input type="text" id="f-name" placeholder="ชื่อของคุณ">
        </div>
      </div>

      <div class="field">
        <label>สถานะความพร้อม</label>
        <div class="status-grid" id="status-grid"></div>
      </div>

      <div class="field">
        <label>สาเหตุและรายละเอียดการเดินทาง</label>
        <textarea id="f-note" placeholder="เช่น น้ำท่วมหน้าบ้าน เดินทางลำบาก ต้องรอ Airport Rail Link เปิด 05:30 น."></textarea>
      </div>

      <button class="btn" id="submitBtn">บันทึกสถานะ</button>
      <div class="msg" id="submitMsg"></div>
    </div>
  </div>

  <div id="dashView">
    <div class="summary" id="summary"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>วันที่</th><th>Team</th><th>รหัส</th><th>ชื่อ-นามสกุล</th><th>สถานะ</th><th>สาเหตุ</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="emptyState" style="display:none;">ยังไม่มีการแจ้งสถานะ</div>
    </div>
  </div>
</div>

<script>
const STATUS_OPTIONS = [
  {v:"มาได้", c:"green"},
  {v:"มาได้ (สายแน่นอน)", c:"green"},
  {v:"มาได้ (เผื่อเวลา)", c:"green"},
  {v:"มาได้ (คาดว่าจะสาย)", c:"amber"},
  {v:"รอดูสถานการณ์", c:"amber"},
  {v:"รอดูสถานการณ์ / ขอหยุด", c:"amber"},
  {v:"ไม่สามารถเดินทางได้", c:"red"},
];

let pickedStatus = null;
const grid = document.getElementById('status-grid');
STATUS_OPTIONS.forEach(opt=>{
  const el = document.createElement('div');
  el.className = 'status-opt sel-'+opt.c;
  el.textContent = opt.v;
  el.dataset.v = opt.v; el.dataset.c = opt.c;
  el.onclick = ()=>{
    pickedStatus = opt;
    [...grid.children].forEach(c=>c.classList.remove('picked'));
    el.classList.add('picked');
  };
  grid.appendChild(el);
});

document.getElementById('f-date').value = new Date().toISOString().slice(0,10);

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('formView').classList.toggle('active', t.dataset.tab==='form');
    document.getElementById('dashView').classList.toggle('active', t.dataset.tab==='dash');
  };
});

let db = null;
(async()=>{
  try{ db = await claude.use('db'); }catch(e){ db = null; }
  if(!db){
    document.getElementById('submitMsg').textContent = 'ไม่สามารถเชื่อมต่อระบบบันทึกข้อมูลได้ในขณะนี้';
    document.getElementById('submitMsg').className = 'msg err';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('emptyState').textContent = 'ไม่สามารถโหลดข้อมูลได้';
    return;
  }
  subscribeDashboard();
})();

document.getElementById('submitBtn').onclick = async ()=>{
  const code = document.getElementById('f-code').value.trim();
  const name = document.getElementById('f-name').value.trim();
  const date = document.getElementById('f-date').value;
  const team = document.getElementById('f-team').value;
  const note = document.getElementById('f-note').value.trim();
  const msgEl = document.getElementById('submitMsg');

  if(!code || !name || !pickedStatus){
    msgEl.textContent = 'กรุณากรอกรหัสพนักงาน ชื่อ และเลือกสถานะ';
    msgEl.className = 'msg err';
    return;
  }
  if(!db){
    msgEl.textContent = 'ระบบบันทึกข้อมูลไม่พร้อมใช้งาน';
    msgEl.className = 'msg err';
    return;
  }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try{
    await db.collection('reports').doc(code).set({
      date, team, code, name,
      status: pickedStatus.v,
      color: pickedStatus.c,
      note,
      updatedAt: new Date().toISOString()
    });
    msgEl.textContent = 'บันทึกสถานะเรียบร้อยแล้ว';
    msgEl.className = 'msg ok';
  }catch(e){
    msgEl.textContent = 'บันทึกไม่สำเร็จ กรุณาลองอีกครั้ง';
    msgEl.className = 'msg err';
  }
  btn.disabled = false; btn.textContent = 'บันทึกสถานะ';
};

function subscribeDashboard(){
  db.collection('reports').onSnapshot(snap=>{
    const rows = snap.docs.map(d=>d.data()).filter(Boolean);
    rows.sort((a,b)=> (a.team||'').localeCompare(b.team||'') || (a.code||'').localeCompare(b.code||''));
    renderSummary(rows);
    renderTable(rows);
  }, err=>{
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('emptyState').textContent = 'ไม่สามารถโหลดข้อมูลได้';
  });
}

function renderSummary(rows){
  const total = rows.length;
  const green = rows.filter(r=>r.color==='green').length;
  const amber = rows.filter(r=>r.color==='amber').length;
  const red = rows.filter(r=>r.color==='red').length;
  document.getElementById('summary').innerHTML = `
    <div class="stat blue"><div class="n">${total}</div><div class="l">พนักงานทั้งหมด</div></div>
    <div class="stat green"><div class="n">${green}</div><div class="l">มาทำงานได้</div></div>
    <div class="stat amber"><div class="n">${amber}</div><div class="l">รอดูสถานการณ์</div></div>
    <div class="stat red"><div class="n">${red}</div><div class="l">ไม่สามารถมาได้</div></div>
  `;
}

function esc(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderTable(rows){
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('emptyState');
  if(!rows.length){
    tbody.innerHTML = '';
    empty.style.display = 'block';
    empty.textContent = 'ยังไม่มีการแจ้งสถานะ';
    return;
  }
  empty.style.display = 'none';
  tbody.innerHTML = rows.map(r=>`
    <tr>
      <td>${esc(r.date)}</td>
      <td><span class="team-chip">${esc(r.team)}</span></td>
      <td>${esc(r.code)}</td>
      <td class="name">${esc(r.name)}</td>
      <td><span class="badge ${esc(r.color)}">${esc(r.status)}</span></td>
      <td>${esc(r.note) || '<span class="small">—</span>'}</td>
    </tr>
  `).join('');
}
</script>
</body>
</html>
